<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Now Showing</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav class="navbar">
    <h1>🎬 BookMyShow</h1>
    <div>
        <a th:href="@{/history}">My Bookings</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>
<main class="container">
    <h2>Now Showing</h2>
    <div class="movie-grid">
        <div class="movie-card" th:each="m : ${movies}">
            <img th:src="${m.posterUrl}" alt="poster">
            <div class="movie-info">
                <h3 th:text="${m.title}"></h3>
                <p><span th:text="${m.language}"></span> • <span th:text="${m.genre}"></span></p>
                <p><span th:text="${m.duration}"></span> • ⭐ <span th:text="${m.rating}"></span></p>
                <a th:href="@{'/locations/' + ${m.id}}" class="btn">Book Now</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
