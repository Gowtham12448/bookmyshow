<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Select Location</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav class="navbar"><h1>🎬 BookMyShow</h1>
    <div><a th:href="@{/home}">Home</a><a th:href="@{/history}">My Bookings</a><a th:href="@{/logout}">Logout</a></div>
</nav>
<main class="container">
    <h2>Select Location - <span th:text="${movie.title}"></span></h2>
    <div class="chip-grid">
        <a class="chip" th:each="loc : ${locations}"
           th:href="@{'/theaters/' + ${movie.id}(location=${loc})}"
           th:text="${loc}"></a>
    </div>
</main>
</body>
</html>
