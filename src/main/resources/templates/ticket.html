<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Ticket</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav class="navbar"><h1>🎬 BookMyShow</h1>
    <div><a th:href="@{/home}">Home</a><a th:href="@{/history}">My Bookings</a><a th:href="@{/logout}">Logout</a></div>
</nav>
<main class="container">
    <div class="ticket">
        <h2>🎟️ Booking Confirmed!</h2>
        <div class="ticket-row"><span>Ticket No:</span><strong th:text="${booking.ticketNumber}"></strong></div>
        <div class="ticket-row"><span>Movie:</span><strong th:text="${booking.show.movie.title}"></strong></div>
        <div class="ticket-row"><span>Theater:</span><strong th:text="${booking.show.theater.name}"></strong></div>
        <div class="ticket-row"><span>Location:</span><strong th:text="${booking.show.theater.location}"></strong></div>
        <div class="ticket-row"><span>Date & Time:</span><strong th:text="${booking.show.showDate} + ' ' + ${booking.show.showTime}"></strong></div>
        <div class="ticket-row"><span>Seats:</span><strong th:text="${#strings.listJoin(booking.seats, ', ')}"></strong></div>
        <div class="ticket-row"><span>Amount:</span><strong>₹<span th:text="${booking.totalAmount}"></span></strong></div>
        <div class="ticket-row"><span>Status:</span><strong th:text="${booking.status}"></strong></div>
    </div>
    <a class="btn-primary" th:href="@{/history}">View My Bookings</a>
</main>
</body>
</html>
