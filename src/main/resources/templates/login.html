<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - BookMyShow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>🎬 BookMyShow</h1>
    <h2>Login</h2>
    <p th:if="${param.error}" class="error">Invalid username or password</p>
    <p th:if="${param.logout}" class="success">Logged out successfully</p>
    <p th:if="${param.registered}" class="success">Registered! Please log in.</p>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p>New here? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
