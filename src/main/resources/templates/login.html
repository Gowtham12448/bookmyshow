<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — BookMyShow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-hero">
        <h1>🎬 BookMyShow</h1>
        <p>Book the latest Indian movies across Andhra Pradesh, Telangana & beyond.</p>
        <div class="auth-features">
            <p>✅ Instant ticket generation</p>
            <p>✅ All city & town coverage</p>
            <p>✅ Easy cancellations</p>
        </div>
    </div>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="muted">Log in to continue</p>
        <p th:if="${param.error}" class="error-banner">❌ Invalid credentials</p>
        <p th:if="${param.logout}" class="success-banner">✅ Logged out</p>
        <p th:if="${param.registered}" class="success-banner">✅ Registered! Please log in.</p>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button class="btn btn-primary btn-full btn-lg" type="submit">Login →</button>
        </form>
        <p class="auth-switch">New here? <a th:href="@{/register}">Create account</a></p>
    </div>
</div>
</body>
</html>
