<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Theaters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/home}" class="logo">🎬 BookMyShow</a>
    <div class="nav-links">
        <a th:href="@{/history}">My Bookings</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</nav>

<main class="container">
    <a class="back-link" th:href="@{'/locations/' + ${movie.id}}">← Back to cities</a>

    <div class="section-header">
        <h2 th:text="'Theaters in ' + ${location}"></h2>
        <form class="inline-search" th:action="@{'/theaters/' + ${movie.id}}" method="get">
            <input type="hidden" name="location" th:value="${location}">
            <input type="text" name="q" placeholder="Search theater…" th:value="${q}">
            <button type="submit">Search</button>
        </form>
    </div>

    <p class="muted" th:text="${movie.title} + ' • ' + ${location}"></p>

    <div class="theater-list">
        <div class="theater-card" th:each="t : ${theaters}">
            <div class="theater-top">
                <div>
                    <h3 th:text="${t.name}"></h3>
                    <p class="brand" th:text="${t.brand}"></p>
                </div>
                <div class="theater-rating">
                    ⭐ <span th:text="${#numbers.formatDecimal(t.rating,1,1)}"></span>
                </div>
            </div>
            <p class="addr" th:text="${t.address}"></p>
            <p class="amenities">
                <span th:each="a,it : ${#strings.arraySplit(t.amenities, ',')}"
                      class="amenity-chip" th:text="${#strings.trim(a)}"></span>
            </p>
            <a class="btn btn-primary"
               th:href="@{'/shows/' + ${movie.id}(theaterId=${t.id})}">View Showtimes →</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(theaters)}">
        <h3>No theaters match</h3>
        <p>Try <a th:href="@{'/theaters/' + ${movie.id}(location=${location})}">clearing search</a>.</p>
    </div>
</main>
</body>
</html>
